name: Tests

on:
  pull_request:
  push:
    branches: [post-gnome45]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: make lint
      - run: make test
        if: ${{ !cancelled() }}
